<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>Liberty Truth - Live Streams</title>
    <link rel=\"stylesheet\" href=\"css/styles.css\">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-container container">
        <a href="feed.html" class="logo">
            <img src="images/logo.png" alt="Liberty Truth Logo" class="navbar-logo">
            <span>Liberty Truth</span>
        </a>
        <ul class="nav-links">
            <li><a href=\"feed.html\">Feed</a></li>
            <li><a href=\"creators.html\">Creators</a></li>
            <li><a href=\"marketplace.html\">Marketplace</a></li>
            <li><a href=\"live.html\" class=\"active\">Live</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">

    <h2>Live Now</h2>
    <div class="live-streams-grid" id="liveGrid">
        <!-- Live stream cards go here -->
    </div>

    <h2>Upcoming Streams</h2>
    <div class="upcoming-streams" id="upcomingGrid">
        <!-- Upcoming stream cards go here -->
    </div>

</div>

<script src=\"js/app.js\"></script>
<script>
    // Logout
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('ltCurrentUser');
        window.location.href = 'index.html';
    });

    // Example live streams data
    const liveStreams = [
        {id:1, title:'Farm Talk with Bob', host:'@bob', viewers:120, thumbnail:'images/placeholder-avatar.png'},
        {id:2, title:'Youth Liberty Q&A', host:'@carol', viewers:85, thumbnail:'images/placeholder-avatar.png'}
    ];

    const upcomingStreams = [
        {id:3, title:'Patriot Workshop', host:'@alice', time:'Nov 30, 3 PM', avatar:'images/placeholder-avatar.png'},
        {id:4, title:'Freedom Debate', host:'@dan', time:'Dec 1, 6 PM', avatar:'images/placeholder-avatar.png'}
    ];

    const liveGrid = document.getElementById('liveGrid');
    const upcomingGrid = document.getElementById('upcomingGrid');

    function renderLiveStreams(list) {
        liveGrid.innerHTML = '';
        list.forEach(s => {
            const card = document.createElement('div');
            card.classList.add('stream-card');
            card.innerHTML = `
                <div class="stream-thumbnail">
                    <img src="${s.thumbnail}" alt="${s.title}">
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="stream-info">
                    <h3>${s.title}</h3>
                    <p class="stream-host">${s.host}</p>
                    <p class="stream-viewers">${s.viewers} viewers</p>
                </div>
            `;
            liveGrid.appendChild(card);

            // Click to enter stream (placeholder)
            card.addEventListener('click', () => {
                alert(`Entering live stream: ${s.title}`);
            });
        });
    }

    function renderUpcomingStreams(list) {
        upcomingGrid.innerHTML = '';
        list.forEach(s => {
            const item = document.createElement('div');
            item.classList.add('upcoming-item');
            item.innerHTML = `
                <img src="${s.avatar}" alt="${s.host}">
                <div>
                    <h4>${s.title}</h4>
                    <p>${s.host}</p>
                    <p>${s.time}</p>
                </div>
            `;
            upcomingGrid.appendChild(item);

            item.addEventListener('click', () => {
                alert(`Reminder set for: ${s.title}`);
            });
        });
    }

    // Initial render
    renderLiveStreams(liveStreams);
    renderUpcomingStreams(upcomingStreams);
</script>

</body>
</html>
